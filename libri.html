<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Libri - VivlioNet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg vivlionet-nav px-4">
    <!-- Stessa navbar dell'index -->
</nav>

<div class="container py-5">
    <h1 class="mb-5">Tutti i Libri</h1>
    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4" id="libriContainer">
        <!-- I libri verranno caricati qui via JavaScript -->
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
fetch("http://localhost/vivlionet/backend/libri.php")
  .then(res => res.json())
  .then(data => {
    const container = document.querySelector("#libriContainer");
    container.innerHTML = "";

    data.forEach(libro => {
      container.innerHTML += `
        <div class="col">
          <div class="card h-100 libro-card">
            <img src="${libro.immagine}" class="card-img-top">
            <div class="card-body">
              <h5 class="card-title">${libro.titolo}</h5>
              <p class="card-text">${libro.genere}</p>
              <a href="#" class="btn btn-primary">Acquista</a>
            </div>
          </div>
        </div>
      `;
    });
  });
</script>

</body>
</html>
