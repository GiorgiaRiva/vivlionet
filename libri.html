<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Libri - VivlioNet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg vivlionet-nav px-4">
    <a class="navbar-brand d-flex align-items-center" href="index.html">
        <img src="https://static.vecteezy.com/system/resources/previews/012/274/592/non_2x/floral-botanical-alphabet-vintage-hand-drawn-monogram-letter-v-letter-with-plants-and-flowers-lettering-isolated-on-white-vector.jpg" height="34">
        <span class="brand-text ms-2">VIVLIONET</span>
    </a>
    <div class="collapse navbar-collapse" id="vivlionetMenu">
        <ul class="navbar-nav ms-4">
            <li class="nav-item"><a class="nav-link" href="xxx.html">Home</a></li>
            <li class="nav-item"><a class="nav-link active" href="libri.html">Libri</a></li>
            <li class="nav-item"><a class="nav-link" href="catalogo.html">Catalogo</a></li>
            <li class="nav-item"><a class="nav-link" href="categorie.html">Categorie</a></li>
        </ul>
        <div class="ms-auto">
            <div class="search-container">
                <input type="text" id="cercaLibro" class="search-input" placeholder="Cerca titolo...">
                <button class="search-btn"><img src="https://www.svgrepo.com/show/532555/search.svg" height="20"></button>
            </div>
        </div>
    </div>
</nav>

<div class="container py-5">
    <h1 class="brand-text mb-4">I Nostri Volumi</h1>
    <div class="row row-cols-1 row-cols-md-3 row-cols-lg-4 g-4" id="gridLibri"></div>
</div>

<script>
    fetch("http://localhost/vivlionet/backend/libri.php")
        .then(r => r.json())
        .then(data => {
            const container = document.getElementById("gridLibri");
            container.innerHTML = data.map(l => `
                <div class="col">
                    <div class="card h-100 libro-card">
                        <img src="${l.immagine}" class="card-img-top" style="height:250px; object-fit:cover;">
                        <div class="card-body">
                            <h5 class="card-title">${l.titolo}</h5>
                            <p class="card-text small">${l.genere}</p>
                            <button class="btn btn-primary w-100">Dettagli</button>
                        </div>
                    </div>
                </div>
            `).join('');
        });
</script>
</body>
</html>
