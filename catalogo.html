<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogo - VivlioNet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg vivlionet-nav px-4">
    <a class="navbar-brand d-flex align-items-center" href="xxx.html">
        <img src="https://static.vecteezy.com/system/resources/previews/012/274/592/non_2x/floral-botanical-alphabet-vintage-hand-drawn-monogram-letter-v-letter-with-plants-and-flowers-lettering-isolated-on-white-vector.jpg" 
             alt="Logo VivlioNet" height="34">
        <span class="brand-text ms-2">VIVLIONET</span>
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#vivlionetMenu" aria-controls="vivlionetMenu" aria-expanded="false" aria-label="Apri menu">
        <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="vivlionetMenu">
        <ul class="navbar-nav ms-4 mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link" href="xxx.html">Home</a></li>
            <li class="nav-item"><a class="nav-link active" aria-current="page" href="catalogo.html">Catalogo</a></li>
            <li class="nav-item"><a class="nav-link" href="categorie.html">Categorie</a></li>
        </ul>

        <div class="flex-grow-1"></div>

        <a href="login.html" class="nav-icon" aria-label="Profilo">
    <img src="https://marketplace.canva.com/gJly0/MAGDkMgJly0/1/tl/canva-user-profile-icon-vector.-avatar-or-person-icon.-profile-picture%2C-portrait-symbol.-MAGDkMgJly0.png" height="26" alt="Icona profilo">
</a>

        <div class="separator mx-3"></div>

        <form class="search-container" role="search">
            <input type="text" class="search-input" placeholder="Cerca nel catalogo..." aria-label="Cerca libri">
            <button class="search-btn" type="submit" aria-label="Cerca">
                <img src="https://www.svgrepo.com/show/532555/search.svg" height="20" alt="Icona ricerca">
            </button>
        </form>
    </div>
</nav>

<div class="container py-5">
    <h1 class="brand-text mb-4">Catalogo Tecnico</h1>
    
    <div class="table-responsive bg-white p-4 rounded shadow-sm border">
        <table class="table align-middle table-hover">
            <thead class="table-light">
                <tr>
                    <th>Nome libro</th>
                    <th>Autore</th>
                    <th>Stato</th>
                </tr>
            </thead>
            <tbody id="tabellaCorpo">
                </tbody>
        </table>
    </div>
</div>

<div class="modal fade" id="dettaglioLibroModal" tabindex="-1" aria-labelledby="modalTitolo" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg"> 
        <div class="modal-content" style="background-color: #fdf9f4; border: 1px solid #e3d6c7;">
            
            <div class="modal-header" style="border-bottom: 1px solid #e3d6c7;">
                <h5 class="modal-title brand-text" id="modalTitolo">Titolo del Libro</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Chiudi"></button>
            </div>
            
            <div class="modal-body text-dark" id="contenitoreDettagli">
                </div>
            
            <div class="modal-footer" style="border-top: 1px solid #e3d6c7;">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Chiudi</button>
                <button type="button" class="btn btn-primary" style="background-color: #7a5238; border: none;">Acquista Ora</button>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Variabile per salvare tutti i libri estratti dal database
    let listaLibri = [];

    // 1. Caricamento dei dati
    fetch("https://columbina.vps.webdock.cloud/vivlionet/libri.php")
        .then(r => {
            if (!r.ok) throw new Error("Errore nel caricamento dei dati");
            return r.json();
        })
        .then(data => {
            listaLibri = data; 
            const corpo = document.getElementById("tabellaCorpo");
            
            if (data.length === 0) {
                corpo.innerHTML = "<tr><td colspan='3' class='text-center py-4'>Nessun libro trovato nel catalogo.</td></tr>";
                return;
            }
            
            corpo.innerHTML = data.map((l, index) => `
                <tr>
                    <td>
                        <a href="#" class="fw-bold text-dark text-decoration-none" style="cursor: pointer;" onclick="apriDettagli(${index}); return false;">
                            ${l.titolo}
                        </a>
                    </td>
                    <td class="text-muted">${l.autore || "Sconosciuto"}</td>
                    <td><span class="text-success fw-medium">● Disponibile</span></td>
                </tr>
            `).join('');
        })
        .catch(err => {    
            console.error("Errore Fetch:", err);
            document.getElementById("tabellaCorpo").innerHTML = "<tr><td colspan='3' class='text-center text-danger py-4'><strong>Errore di connessione al database.</strong> Riprova più tardi.</td></tr>";
        });

    // 2. Funzione per aprire la finestra a comparsa con Immagine + Dettagli
    function apriDettagli(indice) {
        const libro = listaLibri[indice];

        document.getElementById("modalTitolo").innerText = libro.titolo || "Titolo non disponibile";
        
        const contenitore = document.getElementById("contenitoreDettagli");
        let htmlDettagli = ""; 

        // Definiamo l'immagine (se non c'è nel DB, mettiamo il placeholder)
        const linkImmagine = libro.immagine || "https://via.placeholder.com/200x300/fdf9f4/7a5238?text=Nessuna+Copertina";

        // Layout a griglia: Immagine a sinistra, Info a destra
        htmlDettagli += `
            <div class="row align-items-start">
                
                <div class="col-md-4 text-center mb-4 mb-md-0">
                    <img src="${linkImmagine}" alt="Copertina" class="img-fluid rounded shadow-sm border" style="max-height: 280px; object-fit: cover;">
                </div>
                
                <div class="col-md-8">
        `;

        if (libro.autore) htmlDettagli += `<p class="mb-2"><strong>Autore:</strong> <span class="text-muted">${libro.autore}</span></p>`;
        if (libro.anno && libro.anno !== "0000-00-00") htmlDettagli += `<p class="mb-2"><strong>Anno di Pubblicazione:</strong> <span class="text-muted">${libro.anno}</span></p>`;
        if (libro.id_genere) htmlDettagli += `<p class="mb-2"><strong>Codice Genere:</strong> <span class="text-muted">${libro.id_genere}</span></p>`;
        
        if (libro.prezzo) {
            let prezzoFormattato = parseFloat(libro.prezzo).toFixed(2);
            htmlDettagli += `<p class="mt-3 text-success fw-bold fs-4">€ ${prezzoFormattato}</p>`;
        } else {
            htmlDettagli += `<p class="mt-3 text-muted fw-bold">Prezzo non disponibile</p>`;
        }

        // Chiude la colonna destra e la riga
        htmlDettagli += `
                </div>
            </div>
        `;

        // --- PREFAZIONE (Sotto l'immagine e i dati) ---
        if (libro.prefazione) {
            htmlDettagli += `<hr style="border-color: #e3d6c7; margin-top: 20px;">`;
            htmlDettagli += `
                <div class="mt-3">
                    <h6 class="fw-bold mb-2">Prefazione:</h6>
                    <p class="text-muted" style="line-height: 1.6;">${libro.prefazione}</p>
                </div>
            `;
        }

        contenitore.innerHTML = htmlDettagli;

        const modalElement = document.getElementById('dettaglioLibroModal');
        const modal = new bootstrap.Modal(modalElement);
        modal.show();
    }
</script>

</body>
</html>
