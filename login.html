<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VivlioNet - Login & Registrazione</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Layout a due pannelli come la tua immagine */
        .auth-wrapper {
            display: flex;
            max-width: 900px;
            min-height: 550px;
            margin: 60px auto;
            background: #fdf9f4;
            border: 1px solid #e3d6c7;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(74, 46, 31, 0.1);
        }

        .auth-info-side {
            flex: 1;
            background-color: #f6f0e8;
            padding: 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border-right: 1px solid #e3d6c7;
        }

        .auth-form-side {
            flex: 1;
            padding: 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* Stile input coerente con il tuo brand */
        .vivlio-input {
            background: #ede4d7;
            border: 1px solid #d8cabc;
            border-radius: 25px;
            padding: 12px 20px;
            width: 100%;
            margin-bottom: 15px;
            color: #4a2e1f;
        }

        .vivlio-input:focus {
            border-color: #7a5238;
            outline: none;
            box-shadow: 0 0 0 3px rgba(122, 82, 56, 0.2);
        }

        .auth-btn {
            background-color: #7a5238;
            color: white;
            border: none;
            border-radius: 25px;
            padding: 12px;
            font-weight: 700;
            width: 100%;
            transition: all 0.3s;
        }

        .auth-btn:hover {
            background-color: #4a2e1f;
            transform: translateY(-2px);
        }

        .toggle-link {
            color: #7a5238;
            text-decoration: none;
            font-weight: 700;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            .auth-wrapper { flex-direction: column; margin: 20px; }
            .auth-info-side { padding: 30px; text-align: center; }
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg vivlionet-nav px-4">
    <a class="navbar-brand d-flex align-items-center" href="xxx.html">
        <img src="https://static.vecteezy.com/system/resources/previews/012/274/592/non_2x/floral-botanical-alphabet-vintage-hand-drawn-monogram-letter-v-letter-with-plants-and-flowers-lettering-isolated-on-white-vector.jpg" height="34">
        <span class="brand-text ms-2">VIVLIONET</span>
    </a>
</nav>

<div class="container">
    <div class="auth-wrapper">
        <div class="auth-info-side">
            <h1 class="brand-text" id="sideTitle" style="font-size: 2.5rem;">BENTORNATO</h1>
            <div style="width: 50px; height: 4px; background: #7a5238; margin: 20px 0;"></div>
            <p id="sideDesc" style="color: #6b4f3b;">Accedi per immergerti nuovamente nelle tue letture preferite e gestire la tua libreria.</p>
        </div>

        <div class="auth-form-side">
            <h2 class="brand-text mb-2" id="formTitle" style="font-size: 1.5rem;">Login Account</h2>
            <p class="small mb-4 text-muted" id="formSub">Bentornato! Inserisci i tuoi dati.</p>

            <form id="authForm">
                <div id="nameGroup" style="display: none;">
                    <label class="form-label small fw-bold">NOME COMPLETO</label>
                    <input type="text" id="nome" class="vivlio-input" placeholder="Il tuo nome">
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-bold">EMAIL</label>
                    <input type="email" id="email" class="vivlio-input" placeholder="esempio@mail.it" required>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-bold">PASSWORD</label>
                    <input type="password" id="password" class="vivlio-input" placeholder="••••••••" required>
                </div>

                <button type="submit" class="auth-btn mt-2">ACCEDI</button>

                <p class="text-center mt-4 small">
                    <span id="toggleText">Non hai un account?</span> 
                    <a class="toggle-link" id="toggleAction">Registrati ora</a>
                </p>
            </form>
        </div>
    </div>
</div>

<script>
    let isLogin = true;
    const form = document.getElementById('authForm');
    const toggleAction = document.getElementById('toggleAction');

    // Cambia tra Login e Registrazione
    toggleAction.addEventListener('click', () => {
        isLogin = !isLogin;
        document.getElementById('sideTitle').innerText = isLogin ? "BENTORNATO" : "BENVENUTO";
        document.getElementById('sideDesc').innerText = isLogin ? "Accedi per immergerti nuovamente nelle tue letture." : "Crea un profilo per iniziare a collezionare i tuoi libri preferiti.";
        document.getElementById('formTitle').innerText = isLogin ? "Login Account" : "Crea Account";
        document.getElementById('formSub').innerText = isLogin ? "Bentornato! Inserisci i tuoi dati." : "Compila i campi per registrarti.";
        document.getElementById('nameGroup').style.display = isLogin ? "none" : "block";
        document.querySelector('.auth-btn').innerText = isLogin ? "ACCEDI" : "REGISTRATI";
        document.getElementById('toggleText').innerText = isLogin ? "Non hai un account?" : "Hai già un account?";
        toggleAction.innerText = isLogin ? "Registrati ora" : "Accedi qui";
    });

    // Invio dati al PHP
    form.onsubmit = async (e) => {
        e.preventDefault();

const scriptPhp = isLogin 
    ? "login_process.php" 
    : "register.php";

        const payload = {
            email: document.getElementById('email').value,
            password: document.getElementById('password').value
        };
        
        if (!isLogin) {
            payload.nome = document.getElementById('nome').value;
        }

        try {
            const response = await fetch(scriptPhp, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (!response.ok) throw new Error("File PHP non trovato o errore server.");

            const data = await response.json();

            if (data.success) {
                if (isLogin) {
                    alert("Benvenuto, " + data.nome + "!");
                    window.location.href = "xxx.html";
                } else {
                    alert("Registrazione completata! Ora puoi accedere.");
                    toggleAction.click(); // Ritorna automaticamente al Login
                }
            } else {
                alert("Errore: " + data.message);
            }
        } catch (error) {
            console.error(error);
            alert("Errore tecnico: Impossibile collegarsi al database. Controlla che i file PHP siano su Webdock nella stessa cartella.");
        }
    };
</script>

</body>
</html>
